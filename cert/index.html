<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check a NISMCAA Tutor certificate</title><link rel="icon" href="../favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=3"><link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>body{margin:0;font-family:'DM Sans',system-ui,Arial,sans-serif;background:#fff4ec;color:#16264a}.p{background:#ffd34d;text-align:center;font-weight:700;font-size:12px;padding:3px}main{max-width:640px;margin:auto;padding:20px}.c{background:#fff;border:1px solid #ece2da;border-radius:20px;padding:20px;margin:14px 0}input{font:inherit;padding:10px;border:1px solid #ccc;border-radius:12px;width:100%;box-sizing:border-box}button{font:inherit;font-weight:700;background:#ff6b4a;color:#fff;border:0;border-radius:14px;padding:10px 16px;margin-top:8px;min-height:44px}.ok{color:#00897f}.no{color:#b00020}</style></head><body>
<div class="p">PREVIEW – NISMCAA Tutor is in testing.</div><main><p><a href="../">← NISMCAA Tutor</a></p><p><img src="../brand/nismtutor-logo.png?v=3" alt="Nismtutor" width="2151" height="640" style="width:min(100%,420px);height:auto;box-sizing:border-box;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 0 0 2px #e0b84a"></p><h1>Check a NISMCAA Tutor certificate</h1>
<form id="f" class="c"><label>Certificate ID<input id="id" placeholder="NT-2026-XXXXXX" required></label><button>Check</button></form><div id="r"></div></main>
<script>const API=(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&(new URLSearchParams(location.search).get('api')||localStorage.getItem('nt_api')))||'https://nismcaa-payments.onrender.com';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function chk(id){document.getElementById('r').innerHTML='<p>Checking…</p>';const r=await fetch(API+'/tutor/api/cert/'+encodeURIComponent(id.trim()));const j=await r.json();
document.getElementById('r').innerHTML=r.ok?`<div class="c"><h2 class="${j.valid?'ok':'no'}">${j.valid?'✅ Valid certificate':'⚠️ Not active'}</h2><p><b>${E(j.name)}</b><br>Subjects: ${E(j.subjects.join(', '))}<br>Certificate ID: ${E(j.id)}<br>Issued: ${new Date(j.date+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}<br>Status: ${E(j.status)}</p></div>`:`<div class="c"><h2 class="no">❌ Not found</h2><p>No NISMCAA Tutor certificate has this ID.</p></div>`}
const q=new URLSearchParams(location.search).get('id')||(location.pathname.match(/\/cert\/([A-Za-z0-9-]+)/)||[])[1];if(q){document.getElementById('id').value=q;chk(q)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=document.getElementById('id').value;history.replaceState(null,'','?id='+encodeURIComponent(v));chk(v)}</script></body></html>
